<svg xmlns="http://www.w3.org/2000/svg" width="24" height="52" viewBox="0 0 24 52">
  <!-- Upper wick — tip is the hotspot -->
  <line x1="12" y1="1" x2="12" y2="10" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <!-- Bullish body -->
  <rect x="5" y="10" width="14" height="24" fill="#22c55e" stroke="#15803d" stroke-width="1.5" rx="1.5"/>
  <!-- Open / close tick lines inside body -->
  <line x1="5" y1="16" x2="19" y2="16" stroke="#15803d" stroke-width="1"/>
  <line x1="5" y1="28" x2="19" y2="28" stroke="#15803d" stroke-width="1"/>
  <!-- Lower wick -->
  <line x1="12" y1="34" x2="12" y2="51" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
</svg>
